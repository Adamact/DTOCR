name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
        continue-on-error: true

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all sources
        run: python -m compileall -q core db gui parsers services shared web scripts

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        # The parsers depend only on the standard library, so the suite runs
        # without torch, OpenCV or the other heavy runtime dependencies.
        # Tests import `DTOCR.*`, so run from the directory above the checkout.
        run: cd .. && python -m pytest DTOCR/tests -q

  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject local paths, tracked databases and secret files
        # Structural checks only. Customer and project names belong in a local
        # .privacy-denylist, which is gitignored so the terms never ship here.
        run: python scripts/privacy_check.py
